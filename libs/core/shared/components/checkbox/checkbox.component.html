<label class="checkbox" [class.is-disabled]="disabled()">
  <input
    #box
    class="checkbox__input"
    type="checkbox"
    [id]="controlId()"
    [checked]="checked()"
    [disabled]="disabled()"
    (change)="setChecked($event)"
    (blur)="touch.emit()"
  />
  <span class="checkbox__box" aria-hidden="true"></span>
  <span class="checkbox__text"><ng-content /></span>
</label>
