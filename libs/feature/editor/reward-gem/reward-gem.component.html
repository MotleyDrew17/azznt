<button
  type="button"
  class="reward-gem interactive"
  aria-label="Награда"
  [attr.aria-expanded]="open()"
  (pointerdown)="$event.stopPropagation()"
  (pointerover)="$event.stopPropagation()"
  (click)="toggle($event)"
>
  <span class="reward-gem__icon"></span>
</button>
@if (open()) {
  <div
    class="reward-panel"
    [class.reward-panel_above]="above()"
    [style.left.px]="left()"
    [style.top.px]="top()"
    (pointerdown)="$event.stopPropagation()"
    (click)="$event.stopPropagation()"
  >
    <p class="reward-panel__title">Награда</p>
    @for (reward of rewards(); track reward.id) {
      <section class="reward-panel__item">
        <p class="reward-panel__name hint-title">{{ reward.name }}</p>
        @if (reward.description.trim()) {
          <div class="reward-panel__text hint-description">
            <p class="hint-description__label">Описание:</p>
            <div class="hint-description__text">{{ reward.description.trim() }}</div>
          </div>
        }
        @if (reward.isTaken) {
          <p class="reward-panel__taken">Забрано</p>
        } @else {
          <gm-button
            class="reward-panel__claim"
            variant="confirm"
            [disabled]="!claimable()"
            (click)="claim($event, reward.id)"
          >Забрать награду</gm-button>
        }
      </section>
    }
  </div>
}
