<div
  class="quest-node"
  [attr.data-quest-id]="nodeId()"
  [class.quest-node_shift]="shiftHeld()"
  [class.quest-node_grabbing]="grabbing()"
  [class.quest-node_selected]="selected()"
  [class.quest-node_uncommon]="priority() === QuestPriority.Uncommon"
  [class.quest-node_notable]="priority() === QuestPriority.Notable"
  [class.quest-node_epic]="priority() === QuestPriority.Epic"
  [class.quest-node_mythic]="priority() === QuestPriority.Mythic"
  [class.quest-node_legendary]="priority() === QuestPriority.Legendary"
  [class.quest-node_main]="priority() === QuestPriority.Main"
  [class.quest-node_press]="pressing()"
  [class.quest-node_completed]="shownCompleted()"
  [class.quest-node_failed]="failed()"
  [class.quest-node_blocked]="!completed() && !failed() && !available()"
  [style.left.px]="left()"
  [style.top.px]="top()"
  [style.width.px]="size()"
  [style.height.px]="size()"
  [style.z-index]="quest()?.zIndex"
>
  <span class="quest-node__fill"></span>
  @if (quest()?.rewards?.length) {
    <gm-reward-gem class="quest-node__reward" [quest]="quest()!" />
  }
  <span class="quest-node__face">
    @if (mark()) {
      <span class="quest-node__mark">{{ mark() }}</span>
    }
  </span>
  <!-- Вспышка обода -->
  @for (burst of bursts(); track burst) {
    <span class="quest-node__gleam"></span>
    <span class="quest-node__gleam quest-node__gleam_sweep"></span>
    @for (spark of sparks; track spark.left + ':' + spark.top) {
      <span class="quest-node__spark" [style.left.%]="spark.left" [style.top.%]="spark.top" [style.animation-delay.ms]="spark.delay"></span>
    }
  }
</div>
