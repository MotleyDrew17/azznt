<div
  class="quest-node"
  [attr.data-quest-id]="nodeId()"
  [class.quest-node_shift]="shiftHeld()"
  [class.quest-node_grabbing]="grabbing()"
  [class.quest-node_selected]="selected()"
  [class.quest-node_uncommon]="priority() === QuestPriority.Uncommon"
  [class.quest-node_notable]="priority() === QuestPriority.Notable"
  [class.quest-node_epic]="priority() === QuestPriority.Epic"
  [class.quest-node_mythic]="priority() === QuestPriority.Mythic"
  [class.quest-node_legendary]="priority() === QuestPriority.Legendary"
  [class.quest-node_main]="priority() === QuestPriority.Main"
  [class.quest-node_completed]="completed()"
  [class.quest-node_blocked]="!completed() && !available()"
  [style.left.px]="left()"
  [style.top.px]="top()"
  [style.width.px]="size()"
  [style.height.px]="size()"
  [style.z-index]="quest()?.zIndex"
></div>
