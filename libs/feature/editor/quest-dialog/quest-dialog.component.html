<div class="dialog">
  <button type="button" class="dialog__close interactive" (click)="close()" aria-label="Закрыть">
    ×
  </button>

  <h2 class="dialog__title">{{ title }}</h2>

  @if (kind === EditorDialogKind.Storyline) {
    <div class="dialog__body">
      <label class="field">
        <span class="field__label">Название</span>
        <input class="field__control" type="text" name="name" />
      </label>

      <label class="field">
        <span class="field__label">Описание</span>
        <textarea class="field__control field__control_area" name="description" rows="4"></textarea>
      </label>
    </div>
  }

  <div class="dialog__footer">
    @if (kind === EditorDialogKind.Storyline) {
      <app-button variant="confirm" width="148px" (click)="close()">Создать</app-button>
    }
    <app-button width="148px" (click)="close()">Отмена</app-button>
  </div>
</div>
