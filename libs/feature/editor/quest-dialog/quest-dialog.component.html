<div class="dialog">
  <button type="button" class="dialog__close interactive" (click)="close()" aria-label="Закрыть">
    ×
  </button>

  <h2 class="dialog__title">{{ title }}</h2>

  @if (kind === EditorDialogKind.Storyline) {
    <div class="dialog__body">
        <div class="field">
          <label class="field__label" for="storyline-name">Название</label>
          <input id="storyline-name" class="control" type="text" [formField]="storylineForm.name" />
          <span class="field__error">Ошибка названия, ну как так?</span>
        </div>

        <div class="field">
          <label class="field__label" for="storyline-description">Описание</label>
          <textarea id="storyline-description" class="control control_area" name="description" rows="4"></textarea>
          <span class="field__error"></span>
        </div>
      
    </div>
  }

  <div class="dialog__footer">
    @if (kind === EditorDialogKind.Storyline) {
      <app-button variant="confirm" width="148px" (click)="close()" [appDisabled]="storylineForm().invalid()">Создать</app-button>
    }
    <app-button width="148px" (click)="close()">Отмена</app-button>
  </div>
</div>
