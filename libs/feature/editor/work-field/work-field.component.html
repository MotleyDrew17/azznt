<svg class="quest-edges" aria-hidden="true">
  @for (edge of edges(); track edge.id) {
    <line class="quest-edges__line" [attr.x1]="edge.x1" [attr.y1]="edge.y1" [attr.x2]="edge.x2" [attr.y2]="edge.y2" />
    <polygon class="quest-edges__arrow" [attr.points]="edge.arrow" />
  }
  @if (draftEdge(); as edge) {
    <line class="quest-edges__line" [attr.x1]="edge.x1" [attr.y1]="edge.y1" [attr.x2]="edge.x2" [attr.y2]="edge.y2" />
    <polygon class="quest-edges__arrow" [attr.points]="edge.arrow" />
  }
</svg>

@if (contextMenu(); as menu) {
  <span class="quest-pin" [style.left.px]="menu.pinX" [style.top.px]="menu.pinY"></span>
  <div class="context-menu" [style.left.px]="menu.x" [style.top.px]="menu.y" (click)="$event.stopPropagation()">
    <gm-button (click)="openCreateQuest()">Создать квест</gm-button>
  </div>
}

@if (selectedQuest(); as quest) {
  <div
    class="quest-toolbar"
    [style.left.px]="toolbarPosition(quest).x"
    [style.top.px]="toolbarPosition(quest).y"
    (click)="$event.stopPropagation()"
    (pointerdown)="$event.stopPropagation()"
  >
    @if (canLink(quest)) {
      <button type="button" class="quest-toolbar__action interactive hint" [class.hint_below]="hintBelow(quest)" data-hint="Соединить" aria-label="Соединить" (click)="startLink($event)">
        <span class="quest-toolbar__icon quest-toolbar__icon_link"></span>
      </button>
    }
    <button type="button" class="quest-toolbar__action interactive hint" [class.hint_below]="hintBelow(quest)" data-hint="Добавить" aria-label="Добавить" (click)="openRelatedQuest()">
      <span class="quest-toolbar__icon quest-toolbar__icon_plus"></span>
    </button>
    <button type="button" class="quest-toolbar__action interactive hint" [class.hint_below]="hintBelow(quest)" data-hint="Редактировать" aria-label="Редактировать" (click)="editSelectedQuest()">
      <span class="quest-toolbar__icon quest-toolbar__icon_edit"></span>
    </button>
    @if (canDelete(quest)) {
      <button type="button" class="quest-toolbar__action interactive hint" [class.hint_below]="hintBelow(quest)" data-hint="Удалить" aria-label="Удалить" (click)="deleteSelectedQuest()">
        <span class="quest-toolbar__icon quest-toolbar__icon_delete"></span>
      </button>
    }
  </div>
}

@for (quest of quests(); track keyOf(quest)) {
  <gm-quest-node
    [quest]="quest"
    [nodeId]="keyOf(quest)"
    [left]="leftOf(quest)"
    [top]="topOf(quest)"
    [shiftHeld]="shiftHeld()"
    [grabbing]="grabbedId() === keyOf(quest)"
    [selected]="selectedQuestId() === quest.id"
    [root]="quest.id === rootId()"
  />
}
