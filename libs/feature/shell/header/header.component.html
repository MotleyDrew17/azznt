<div class="header">
  <div class="header__heading">
    <h1 class="header__title">{{ title() }}</h1>
  </div>
  <div class="header__nav">
    <gm-nav-menu />
    <button
      type="button"
      class="header__action header__back interactive"
      appHint="Назад"
      aria-label="Назад"
      [disabled]="!canBack()"
      (click)="back()"
    >
      <span class="header__icon header__icon_back"></span>
    </button>
  </div>
  @if (showMode() || showTools()) {
    <div class="header__files">
      @if (showMode()) {
        <button
          type="button"
          class="header__action header__action_mode interactive"
          [class.header__action_play]="mode() === FieldMode.Editor"
          [appHint]="mode() === FieldMode.Editor ? 'Игра' : 'Редактор'"
          [attr.aria-label]="mode() === FieldMode.Editor ? 'Игра' : 'Редактор'"
          (click)="toggleMode()"
        >
          @if (mode() === FieldMode.Editor) {
            <span class="header__icon header__icon_play"></span>
          } @else {
            <span class="header__icon header__icon_pen"></span>
          }
        </button>
      }
      @if (showTools()) {
        <button type="button" class="header__action interactive" appHint="Скачать" aria-label="Скачать" (click)="download()">
          <span class="header__icon header__icon_download"></span>
        </button>
        <button type="button" class="header__action interactive" appHint="Загрузить" aria-label="Загрузить" (click)="openFile()">
          <span class="header__icon header__icon_upload"></span>
        </button>
        <input #file class="header__file" type="file" accept=".gm" (change)="loadFile($event)" />
      }
    </div>
  }
</div>
