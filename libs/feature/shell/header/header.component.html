<div class="header">
  <button
    type="button"
    class="header__action header__action_mode interactive hint hint_below"
    [class.header__action_play]="mode() === FieldMode.Editor"
    [attr.data-hint]="mode() === FieldMode.Editor ? 'Игра' : 'Редактор'"
    [attr.aria-label]="mode() === FieldMode.Editor ? 'Игра' : 'Редактор'"
    (click)="toggleMode()"
  >
    @if (mode() === FieldMode.Editor) {
      <span class="header__icon header__icon_play"></span>
    } @else {
      <span class="header__icon header__icon_pen"></span>
    }
  </button>
  <div class="header__files">
    <button type="button" class="header__action interactive hint hint_below" data-hint="Скачать" aria-label="Скачать" (click)="download()">
      <span class="header__icon header__icon_download"></span>
    </button>
    <button type="button" class="header__action interactive hint hint_below" data-hint="Загрузить" aria-label="Загрузить" (click)="openFile()">
      <span class="header__icon header__icon_upload"></span>
    </button>
    <input #file class="header__file" type="file" accept=".gm" (change)="loadFile($event)" />
  </div>
</div>
